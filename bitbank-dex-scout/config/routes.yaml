# ルート定義。1行 = 「bitbankのペア × 出金チェーン」。
#
# 出金手数料（withdraw_fee）は bitbank 公式の手数料ページ https://bitbank.cc/guide/fee から写した値。
# bitbank の都合で変わるので、確認したら fee_checked_at を更新すること（30日以上前だと画面に警告が出る）。
# 公開APIでは出金手数料も出金停止状態も取れない（取れるのはAPIキーが要る /user/assets のみ）ため、手動管理にしている。
#
# token:
#   native                         … そのチェーンのネイティブトークン（ガス代トークン）
#   { address, decimals }          … ERC-20。コントラクトアドレスを直接指定（手動上書きはここ）
#   { coingecko: <coin id> }       … CoinGecko から自動で引く（結果は .cache/tokens.json にキャッシュ）
# targets: 受け取りたいUSDCの種類（chains.yaml の usdc のキー）。省略時は [USDC]
# disabled: true にすると計算対象から外す（出金停止中など）。disabled_reason に理由を書く

fx:
  provider: frankfurter       # frankfurter（日次・ECB）| open-er-api（日次〜数時間ごと）| manual
  # manual_rate: 150          # provider: manual のときに使う USD/JPY

trading_fee:
  # bitbank の /spot/pairs から自動取得する。取れないときだけこの値を使う
  taker: 0.0012
  maker: -0.0002

amounts_jpy: [10000, 50000, 100000, 500000]

thresholds:
  fee_stale_days: 30          # fee_checked_at がこれより古いと警告
  thin_book_slippage: 0.005   # VWAP が最良売値より 0.5% 以上悪いと「板が薄い」

routes:
  # ---- Polygon ----
  - pair: pol_jpy
    asset: POL
    chain: polygon
    withdraw_fee: 1.4
    fee_checked_at: "2026-10-07"
    token: native
    targets: [USDC, USDC.e]
